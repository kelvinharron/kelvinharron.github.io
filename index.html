<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fffaf2">
  <meta name="description" content="Peck is a friendly calorie and macro tracker. Log meals, follow your goals, and understand your week.">
  <link rel="icon" type="image/png" href="/assets/peck-icon.png">
  <link rel="apple-touch-icon" href="/assets/peck-icon.png">
  <title>Peck — Friendly nutrition tracking</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #fffaf2;
      --card: #fffdf9;
      --ink: #332d29;
      --muted: #756d66;
      --accent: #e8734a;
      --line: #eee4d7;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px 20px;
      display: grid;
      place-items: center;
      background: radial-gradient(ellipse at 50% 0%, #ffeddc 0, var(--paper) 58%);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }
    main { width: min(100%, 520px); }
    .icon {
      display: block;
      width: 104px;
      height: 104px;
      margin: 0 auto 22px;
      border-radius: 25px;
      box-shadow: 0 12px 30px #8d573522;
    }
    h1 {
      margin: 0;
      color: var(--accent);
      font-size: clamp(2.5rem, 10vw, 3.5rem);
      font-weight: 750;
      letter-spacing: -0.055em;
    }
    .tagline {
      margin: 8px auto 26px;
      color: var(--muted);
      font-size: 1.08rem;
      line-height: 1.6;
    }
    .card {
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--card);
      box-shadow: 0 16px 42px #6841260b;
    }
    .card p { margin: 0; line-height: 1.7; }
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 50px;
      margin-top: 22px;
      padding: 0 22px;
      border-radius: 999px;
      background: var(--accent);
      color: white;
      font-weight: 700;
      text-decoration: none;
      transition: transform 150ms ease, background 150ms ease;
    }
    .button:hover { background: #d9633b; transform: translateY(-1px); }
    .links {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 20px;
      margin-top: 24px;
    }
    .links a { color: var(--muted); font-size: .92rem; text-underline-offset: 3px; }
    .links a:hover { color: var(--accent); }
    footer { margin-top: 38px; color: #968c83; font-size: .82rem; }
  </style>
</head>
<body>
  <main>
    <img class="icon" src="assets/peck-icon.png" alt="Peck app icon" width="104" height="104">
    <h1>Peck</h1>
    <p class="tagline">Friendly nutrition tracking, one peck at a time.</p>

    <section class="card" aria-label="About Peck">
      <p>Log meals, keep an eye on your calories and macros, and make progress at your own pace. Peck keeps the everyday basics simple.</p>
      <a class="button" href="https://apps.apple.com/app/id6760778069" rel="noopener">Get Peck on the App Store</a>
    </section>

    <nav class="links" aria-label="More information">
      <a href="https://kelvinharron.github.io/peck-website/privacy-policy.html">Privacy Policy</a>
      <a href="https://kelvinharron.github.io/peck-website/">Support</a>
    </nav>
    <footer>© 2026 Kelvin Harron</footer>
  </main>
</body>
</html>
